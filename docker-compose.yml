services:
  robonet:
    image: robonet-base
    container_name: robonet_$USER
    build:
      context: .
    entrypoint: ["/bin/bash", "-c", "/home/robonet/widowx_envs/scripts/run.sh"]
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/robonet/.Xauthority
      - ROBONETV2_ARM=wx250s
      - DATA=/home/robonet/trainingdata
      - EXP=/home/robonet/experiments
      - USE_REALSENSE=true
    user: 1000:1000
    group_add:
      - "46"
      - "44"
      - "27"
    stdin_open: true
    tty: true
    device_cgroup_rules:
      - 'c *:* rmw'
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${USB_CONNECTOR_CHART:-/dev/null}:/tmp/camera_connector_chart
      - /etc/localtime:/etc/localtime:ro
      - ./widowx_envs/experiments:/home/robonet/experiment
      # /media/harddrive/:/home/robonet/trainingdata  # TODO (YL): better way to mount a local directory
      - ./trainingdata:/home/robonet/trainingdata
      - ./widowx_envs:/home/robonet/widowx_envs
      - ./widowx_controller:/home/robonet/widowx_controller
      - ./multicam_server:/home/robonet/multicam_server
      - /dev:/dev  # for host tty access
      - ${HOME}/.Xauthority:/home/robonet/.Xauthority:ro
